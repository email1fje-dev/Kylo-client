name: Build Kylo Minecraft Engine Preview

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/engine-preview.yml"
      - "ENGINE_INTEGRATION.md"

permissions:
  contents: read

concurrency:
  group: kylo-engine-preview
  cancel-in-progress: true

jobs:
  build-engine:
    name: Build Java Minecraft engine base
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Amethyst engine source
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          path: engine
          submodules: false
          fetch-depth: 0

      - name: Configure HTTPS for public submodules
        working-directory: engine
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download the engine's Java 8 runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Prepare language list and brand the debug build
        working-directory: engine
        run: |
          bash ./scripts/languagelist_updater.sh
          sed -i 's/"Amethyst (Debug)"/"Kylo Client (Engine Preview)"/g' app_pojavlauncher/build.gradle
          test -d app_pojavlauncher/src/main/assets/components/jre

      - name: Build engine APK
        working-directory: engine
        env:
          CURSEFORGE_API_KEY: DUMMY
        run: gradle --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Verify engine APK
        run: |
          APK="engine/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'classes.dex'
          ls -lh "$APK"

      - name: Upload engine APK
        uses: actions/upload-artifact@v4
        with:
          name: Kylo-Minecraft-Engine-Preview
          path: engine/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          if-no-files-found: error
          retention-days: 14
