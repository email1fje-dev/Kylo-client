name: Build Kylo Client with FCL Engine

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kylo-engine-preview
  cancel-in-progress: true

jobs:
  build-kylo:
    name: Build Kylo shell with Fold Craft Launcher engine
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout Fold Craft Launcher engine
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/FoldCraftLauncher
          ref: main
          path: fcl
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Kylo client shell
        uses: actions/checkout@v4
        with:
          repository: email1fje-dev/Kylo-client
          ref: ${{ github.ref }}
          path: kylo

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: fcl/**/*.gradle*

      - name: Integrate Kylo home screen into FCL app
        working-directory: fcl
        run: |
          set -euo pipefail
          mkdir -p FCL/src/main/assets/kylo/www
          cp ../kylo/index.html ../kylo/style.css ../kylo/app.js FCL/src/main/assets/kylo/www/

          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("FCL/src/main")
          manifest = base / "AndroidManifest.xml"
          xml = manifest.read_text()
          activity = '''
                  <activity
                      android:name=".activity.KyloHomeActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize|smallestScreenSize|screenLayout|keyboard|navigation|uiMode"
                      android:screenOrientation="sensorPortrait"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize" />
          '''
          marker = '        <activity\n            android:name=".activity.MainActivity"'
          if "android:name=\".activity.KyloHomeActivity\"" not in xml:
              if marker not in xml:
                  raise SystemExit("Could not find MainActivity manifest entry")
              xml = xml.replace(marker, activity + "\n" + marker, 1)
              manifest.write_text(xml)

          splash = base / "java/com/tungsten/fcl/activity/SplashActivity.kt"
          source = splash.read_text()
          # Suppress the upstream launcher wallpaper so it does not flash before Kylo.
          source, replaced = re.subn(
              r"(?m)^\s*ImageUtil\.loadInto\(\s*binding\.background, ThemeEngine\.getInstance\(\)\.getTheme\(\)\.getBackground\(this\)\s*\)",
              "        binding.background.setBackgroundColor(android.graphics.Color.rgb(9, 9, 12))",
              source,
              count=1
          )
          if replaced != 1:
              raise SystemExit("Could not remove FCL startup wallpaper call")
          old = "Intent(this@SplashActivity, MainActivity::class.java)"
          if old not in source:
              raise SystemExit("Could not find FCL launcher transition in SplashActivity")
          source = source.replace(old, "Intent(this@SplashActivity, KyloHomeActivity::class.java)", 1)
          splash.write_text(source)

          strings = base / "res/values/strings.xml"
          text = strings.read_text()
          text = re.sub(r'(<string name="app_name"[^>]*>).*?(</string>)',
                        r'\1Kylo Client\2', text, count=1)
          strings.write_text(text)
          PY

          # Give Android's launcher icon Kylo branding instead of the upstream FCL icon.
          mkdir -p FCL/src/main/res/drawable
          cat > FCL/src/main/res/drawable/ic_kylo_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#09090C" android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#F04452" android:pathData="M7,6h8v14l13,-14h11L24,22l16,20H29L18,28l-3,4v10H7z"/>
          </vector>
          XML
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_kylo_launcher"|g; s|android:roundIcon="@mipmap/ic_launcher"|android:roundIcon="@drawable/ic_kylo_launcher"|g' FCL/src/main/AndroidManifest.xml

          cat > FCL/src/main/java/com/tungsten/fcl/activity/KyloHomeActivity.kt <<'KOTLIN'
          package com.tungsten.fcl.activity

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import android.widget.ProgressBar
          import android.app.AlertDialog
          import java.util.UUID
          import androidx.appcompat.app.AppCompatDialog
          import com.tungsten.fcl.setting.Profiles
          import com.tungsten.fcl.setting.Accounts
          import org.json.JSONArray
          import org.json.JSONObject
                    import com.tungsten.fcl.ui.version.Versions
                    import com.tungsten.fclcore.download.GameBuilder
          import com.tungsten.fclcore.task.Schedulers
          import com.tungsten.fclcore.task.Task
          import com.tungsten.fclcore.task.TaskExecutor
          import com.tungsten.fclcore.task.TaskListener

          class KyloHomeActivity : Activity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(9, 9, 12)
                  window.navigationBarColor = Color.rgb(9, 9, 12)
                  window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)

                  webView = WebView(this)
                  webView.setBackgroundColor(Color.rgb(9, 9, 12))
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = false
                      loadsImagesAutomatically = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }
                  webView.addJavascriptInterface(KyloBridge(), "KyloAndroid")
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/kylo/www/index.html")
              }

              inner class KyloBridge {
                  @JavascriptInterface
                  fun getAccounts(): String {
                      val result = JSONArray()
                      val selected = Accounts.getSelectedAccount()
                      Accounts.getAccounts().forEachIndexed { index, account ->
                          result.put(JSONObject().put("index", index)
                              .put("name", account.character ?: account.username ?: "Minecraft account")
                              .put("selected", account === selected))
                      }
                      return result.toString()
                  }

                  @JavascriptInterface
                  fun selectAccount(index: Int): Boolean {
                      val accounts = Accounts.getAccounts()
                      if (index < 0 || index >= accounts.size) return false
                      Accounts.setSelectedAccount(accounts[index])
                      return Accounts.getSelectedAccount() === accounts[index]
                  }

                  @JavascriptInterface
                  fun addOfflineAccount(username: String?): String {
                      val name = username?.trim() ?: return "نام کاربری نامعتبر است."
                      if (!name.matches(Regex("[A-Za-z0-9_]{3,16}"))) return "نام کاربری نامعتبر است."
                      return try {
                          val account = Accounts.FACTORY_OFFLINE.create(
                              name,
                              com.tungsten.fclcore.auth.offline.OfflineAccountFactory.getUUIDFromUserName(name)
                          )
                          Accounts.addAccount(account)
                          Accounts.setSelectedAccount(account)
                          if (Accounts.getSelectedAccount() === account) "ok" else "ذخیرهٔ اکانت ناموفق بود."
                      } catch (error: Exception) {
                          error.message ?: "ساخت اکانت ناموفق بود."
                      }
                  }

                  @JavascriptInterface
                  fun launchMinecraft(version: String?) {
                      val selected = version?.takeIf { it.matches(Regex("[0-9]+\\.[0-9]+(\\.[0-9]+)?")) }
                          ?: "1.8.9"
                      runOnUiThread { launchOrInstall(selected) }
                  }
              }

              private fun launchOrInstall(version: String) {
                  if (Accounts.getSelectedAccount() == null) {
                      webView.evaluateJavascript("window.kyloAccountRequired && window.kyloAccountRequired()", null)
                      return
                  }
                  val profile = Profiles.getSelectedProfile()
                  val repository = profile.repository
                  if (!repository.isLoaded) {
                      Toast.makeText(this, "Preparing Minecraft versions…", Toast.LENGTH_SHORT).show()
                      val refreshTask = repository.refreshVersionsAsync()
                      val refreshExecutor = refreshTask.executor(object : TaskListener() {
                          override fun onStop(success: Boolean, executor: TaskExecutor) {
                              runOnUiThread {
                                  if (success && repository.isLoaded) {
                                      launchOrInstall(version)
                                  } else {
                                      webView.evaluateJavascript("window.kyloLaunchError && window.kyloLaunchError('Could not load Minecraft versions. Check your connection and try again.')", null)
                                  }
                              }
                          }
                      })
                      refreshExecutor.start()
                      return
                  }

                  if (repository.hasVersion(version)) {
                      profile.selectedVersion = version
                      Toast.makeText(this, "Launching Minecraft $version…", Toast.LENGTH_SHORT).show()
                      Versions.launch(this, profile, version)
                      return
                  }

                  // Use FCL's own dependency manager and task system so Minecraft libraries,
                  // version metadata, assets and game files are installed by the engine itself.
                  val task: Task<Void> = profile.getDependency().gameBuilder()
                      .name(version)
                      .gameVersion(version)
                      .buildAsync()
                      .whenComplete { profile.repository.refreshVersions() }

                  val progress = ProgressBar(this).apply {
                      isIndeterminate = true
                      setPadding(48, 24, 48, 24)
                  }
                  var executorRef: TaskExecutor? = null
                  val dialog = AlertDialog.Builder(this)
                      .setTitle("Installing Minecraft $version")
                      .setView(progress)
                      .setNegativeButton("Cancel") { _, _ -> executorRef?.cancel() }
                      .create()
                  val executor: TaskExecutor = task.executor(object : TaskListener() {
                      override fun onStop(success: Boolean, executor: TaskExecutor) {
                          runOnUiThread {
                              if (success) {
                                  val current = Profiles.getSelectedProfile()
                                  current.selectedVersion = version
                                  Toast.makeText(this@KyloHomeActivity, "Minecraft $version installed. Launching…", Toast.LENGTH_LONG).show()
                                  Versions.launch(this@KyloHomeActivity, current, version)
                              } else {
                                  val error = executor.exception?.message ?: "Installation failed or was cancelled."
                                  Toast.makeText(this@KyloHomeActivity, error, Toast.LENGTH_LONG).show()
                                  webView.evaluateJavascript("window.kyloLaunchError && window.kyloLaunchError('Could not install Minecraft $version. Check your connection and try again.')", null)
                              }
                          }
                      }
                  })
                  executorRef = executor
                  dialog.show()
                  executor.start()
              }

              private fun openEngine(message: String) {
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show()
                  startActivity(Intent(this, MainActivity::class.java))
              }

              override fun onResume() {
                  super.onResume()
                  if (::webView.isInitialized) {
                      webView.postDelayed({ webView.evaluateJavascript("window.refreshKyloAccounts && window.refreshKyloAccounts()", null) }, 250)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView.saveState(outState)
                  super.onSaveInstanceState(outState)
              }
          }
          KOTLIN

          # The game launch helper assumes the legacy MainActivity is alive.
          # Kylo launches from its own Activity, so guard the optional legacy video cleanup.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FCL/src/main/java/com/tungsten/fcl/game/LauncherHelper.java")
          s = p.read_text()
          import re
          pattern = r"if\\s*\\(\\s*MainActivity\\.getInstance\\(\\)\\.shouldPlayVideo\\(\\)\\s*\\)\\s*\\{\\s*MainActivity\\.getInstance\\(\\)\\.setMediaPlayer\\(null\\)\\s*;\\s*MainActivity\\.getInstance\\(\\)\\.binding\\.videoView\\.stopPlayback\\(\\)\\s*;\\s*\\}"
          new = """if (context instanceof MainActivity) {
                                  MainActivity mainActivity = (MainActivity) context;
                                  if (mainActivity.shouldPlayVideo()) {
                                      mainActivity.setMediaPlayer(null);
                                      mainActivity.binding.videoView.stopPlayback();
                                  }
                              }"""
          s, count = re.subn(pattern, new, s, count=1)
          if count != 1:
              raise SystemExit("Could not locate legacy MainActivity video cleanup in LauncherHelper")
          p.write_text(s)
          PY

