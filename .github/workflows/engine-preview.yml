name: Build Kylo with Fold Craft Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/engine-preview.yml"
      - "ENGINE_INTEGRATION.md"

permissions:
  contents: read

concurrency:
  group: kylo-engine-preview
  cancel-in-progress: true

jobs:
  build-fcl:
    name: Build Fold Craft Launcher for Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout Fold Craft Launcher source
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/FoldCraftLauncher
          ref: main
          path: fcl
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: fcl/**/*.gradle*

      - name: Build Fold Craft Launcher debug APK for ARM64
        working-directory: fcl
        env:
          CURSE_API_KEY: DUMMY
          OAUTH_API_KEY: DUMMY
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assemblefordebug -Darch=arm64 --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          find fcl/FCL/build/outputs/apk -type f -name '*.apk' -print -exec ls -lh {} \;
          APK="$(find fcl/FCL/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Fq 'classes.dex'

      - name: Upload Fold Craft Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Kylo-FoldCraft-Engine-ARM64
          path: fcl/FCL/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
