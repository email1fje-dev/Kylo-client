              "UI scale":"مقیاس رابط","Enable ":"فعال‌کردن ","Configure ":"تنظیمات ","Save":"ذخیره","Cancel":"لغو"
            };
            const translate = value => {
              let s = value;
              if (Object.prototype.hasOwnProperty.call(dict, s)) return dict[s];
              for (const [en, fa] of Object.entries(dict).sort((a,b)=>b[0].length-a[0].length)) {
                s = s.split(en).join(fa);
              }
              return s;
            };
            const walk = root => {
              if (!root) return;
              const nodes = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
              const list = [];
              while (nodes.nextNode()) list.push(nodes.currentNode);
              for (const n of list) {
                const v = n.nodeValue;
                const t = translate(v.trim());
                if (t !== v.trim()) n.nodeValue = v.replace(v.trim(), t);
              }
              root.querySelectorAll?.("input[placeholder],button[aria-label],button[title],input[aria-label]").forEach(el => {
                for (const attr of ["placeholder","aria-label","title"]) if (el.hasAttribute(attr)) el.setAttribute(attr, translate(el.getAttribute(attr)));
              });
            };
            const start = () => {
              walk(document.body);
              new MutationObserver(records => records.forEach(r => {
                if (r.type === "childList") r.addedNodes.forEach(n => { if (n.nodeType === 1) walk(n); else if (n.nodeType === 3) { const t=translate(n.nodeValue.trim()); if(t!==n.nodeValue.trim()) n.nodeValue=n.nodeValue.replace(n.nodeValue.trim(),t); } });
                if (r.type === "characterData") { const t=translate(r.target.nodeValue.trim()); if(t!==r.target.nodeValue.trim()) r.target.nodeValue=r.target.nodeValue.replace(r.target.nodeValue.trim(),t); }
              })).observe(document.body,{subtree:true,childList:true,characterData:true});
            };
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, {once:true}); else start();
          })();
