name: Build Kylo Client Android APK

on:
  push:
    branches: ["main", "remove-fcl-ui"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kylo-android-build
  cancel-in-progress: true

jobs:
  build-full-launcher:
    name: Build Kylo with the full Fold Craft Launcher engine
    uses: ./.github/workflows/engine-preview.yml
    permissions:
      contents: read
